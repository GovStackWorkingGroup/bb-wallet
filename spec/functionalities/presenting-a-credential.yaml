requirements:
- id: ''
  level: required
  observability:
  mutability:
  title:
  content: "The wallet MUST provide mechanisms that enable a credential verifier to\n\
    establish trust in the wallet before the verifier requests a verifiable\npresentation."
- id: ''
  level: required
  observability:
  mutability:
  title:
  content: "The wallet MUST be able to receive and process a credential verifier's\n\
    request for a verifiable presentation."
- id: ''
  level: required
  observability:
  mutability:
  title:
  content: "The credential wallet MUST be able to validate the verifier before\npresenting
    a credential"
- id: ''
  level: recommended
  observability:
  mutability:
  title:
  content: "The credential wallet SHOULD capture the holder's consent before the\n\
    credentials are presented to any verifier."
- id: ''
  level: recommended
  observability:
  mutability:
  title:
  content: The credential issuer SHOULD NOT be involved in the presentation 
    process
- id: ''
  level: recommended
  observability:
  mutability:
  title:
  content: "The credential wallet (with the holder's consent) SHOULD be able to\n\
    present a selected subset of the data fields (claims) from a credential\nwhile
    other fields are not revealed to the verifier."
- id: ''
  level: required
  observability:
  mutability:
  title:
  content: "The wallet MUST be able to present a verifiable presentation to the\n\
    credential verifier in response to a valid request."
- id: ''
  level: recommended
  observability:
  mutability:
  title:
  content: "The credential verifier SHOULD be able to verify the presentations after\n\
    receiving the presentation"
- id: ''
  level: recommended
  observability:
  mutability:
  title:
  content: "The credential wallet SHOULD enable the holder to present a pseudonym\n\
    instead of their real identity when authenticating online or presenting\ncredentials,
    except in cases where identification is mandatory."
- id: ''
  level: recommended
  observability:
  mutability:
  title:
  content: "The credential verifier SHOULD NOT be able to link two presentations to\n\
    the same holder (unless the holder's information is provided as part of\nthe presentation)"
- id: ''
  level: recommended
  observability:
  mutability:
  title:
  content: "Two credential verifiers SHOULD NOT be able to link two presentation\n\
    transactions to the same holder by sharing the received presentations"
- id: ''
  level: recommended
  observability:
  mutability:
  title:
  content: "After receiving a presentation the credential verifier SHOULD NOT be\n\
    able to prove to any third party that the holder had presented the\ncredentials
    to the verifier for identification purposes earlier."
- id: ''
  level: recommended
  observability:
  mutability:
  title:
  content: "The credential wallet backend SHOULD NOT be able to track where the\n\
    credentials are being presented or learn details about the attributes of\nany
    transactions performed by the Holder"
- id: ''
  level: recommended
  observability:
  mutability:
  title:
  content: "The credential verifier SHOULD NOT be able to prove to any third party\n\
    the credential's authenticity and the integrity of its attributes that\nthe verifier
    had previously verified."
- id: ''
  level: recommended
  observability:
  mutability:
  title:
  content: "The credential issuer and the credential verifier should not be able to\n\
    link an issuance and presentation session to the same holder (unless the\nHolder
    provides sufficiently identifying information as part of their\nauthentication
    to the Issuer and as part of the presented credential\nshared with the verifier)"

---
name: Wallet Building Block Specification
abstract: GovStack Specification on Digital Wallets.
url: https://specs.govstack.global/bb-wallet/
repository: https://github.com/govStackWorkingGroup/bb-wallet
urn: govstack:spec:bb:wallet
owner_group: govstack:wg:cfid
capabilities:
  - id: secure-custody
    title: Secure Credential Custody
    description: Holders keep the credentials issued to them where only they can use them.
  - id: credential-collection
    title: Credential Collection
    description: Holders receive credentials from those who issue them, and keep them, checked, in one place.
  - id: credential-currency
    title: Credential Currency
    description: Holders know which of their credentials are still valid, and keep them up to date.
  - id: credential-presentation
    title: Credential Presentation
    description: Holders prove facts about themselves to others by presenting their credentials.
  - id: holder-control
    title: Holder Control
    description: Holders decide what is done with their credentials, see what was done, and can move or remove them.
  - id: privacy
    title: Privacy-Preserving Disclosure
    description: Holders share only what a transaction needs, without being tracked across transactions.
  - id: holder-rights
    title: Holder Recourse
    description: Holders can complain about, and ask for deletion from, those they presented credentials to.
  - id: online-authentication
    title: Online Authentication
    description: Holders log in to online services with their wallet, under their identity or a pseudonym.
  - id: document-signing
    title: Document Signing
    description: Holders sign documents with keys their wallet keeps.
versions:
  - version: 2.0-draft
    short_description: Decoupling Wallet from OpenID specifications. Adding Bearer and Pass credential types.
    latest: true 
  - version: 1.2.0
    release_date: 2026-05-01
    short_description: Re-writing requirements related to Issuers and Verifiers from the Wallet point of view to address compliance testing. See Release Notes
  - version: 1.1.0
    release_date: 2025-12-01
    short_description: Updates for Terminology, minor typo/grammatical corrections. Ensuring alignment to GovSpecs 2.0 (Required/Recommended). See Release Notes
  - version: 1.0.0
    release_date: 2025-09-01
    short_description: Externally reviewed and approved version. See Release Notes
  - version: 1.0.0-rc
    release_date: 2025-05-01
    short_description: Final revision by Working Group
